; Dawnwalker Controller Tweaks
; Read once at game startup. Edit through Vortex's Open in File Manager,
; deploy, and restart the game. Back up this file before replacing the mod.
; Values are case-insensitive. Xbox aliases (PlayStation equivalents):
; A=Cross, B=Circle, X=Square, Y=Triangle; LB=L1, LT=L2, RB=R1, RT=R2;
; LS=L3, RS=R3, View=Touchpad, Menu=Options.
; Also: DPadUp/Down/Left/Right, LeftStick, RightStick,
; RightStickLeft, RightStickRight. Full Gamepad_* names are accepted too.
; Each value is the physical control you want to press for that action.
; Several actions share controls intentionally in different game contexts.
; Missing entries keep this mod's defaults. An invalid file is rejected in full.

[General]
Enabled = true
DebugLogging = false

[Bindings]
Camera_Look = RightStick
Traversal_Movement_Axis = LeftStick
Traversal_Sprint = LS
Traversal_Jump = A
Traversal_Crouch = B
Traversal_Planeshift = Y
Combat_Draw_Weapon = Y
Combat_Block = LT
Combat_Dodge = B
Combat_Target_Previous = RightStickLeft
Combat_Target_Next = RightStickRight
Combat_Target_Lock = RS
Player_Drink_Blood = X
Player_Focus_Mode = LB
Player_Interact = X
Player_Shadowstep = RB
Combat_Attack = RT
Combat_Abilities = LB
Player_Abilities_Gamepad = RT
Player_Hub_Launch = View
Player_Quickslot_Top = DPadUp
Player_Quickslot_Left = DPadLeft
Player_Quickslot_Right = DPadRight
Player_Quickslot_Bottom = DPadDown
Combat_Switch_Weapon = X
Toggle_Quickslot = A
Toggle_Controls_Legend = Menu
Photo_Vertical_Rise = RB
Photo_Vertical_Fall = LB
Photo_Exit = B
Player_Hub_Map = View
