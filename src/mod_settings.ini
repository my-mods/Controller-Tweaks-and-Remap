[Mod]
Id = oOCamilleOo_ControllerTweaksAndRemap
Name = Controller Tweaks and Remap
Author = oOCamilleOo
Version = 1.5.2
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Runtime remapping
Group = General
Description = Controls runtime remapping only; packaged map/hub and movement changes remain installed. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

