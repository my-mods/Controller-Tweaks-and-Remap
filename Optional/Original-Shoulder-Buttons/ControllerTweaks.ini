; DAWNWALKER CONTROLLER TWEAKS - ORIGINAL SHOULDER BUTTONS, 1.4.0
; Optional personal preset: restore original LB/LT and RB/RT, including Photo Mode.
; Requires the main Controller Tweaks 1.4.0 mod and compatible UE4SS.
; Target: %LOCALAPPDATA%/Dawnwalker/Saved/Config/ControllerTweaks.ini
; Manual download only. Read README.txt before copying; back up an existing INI.
; Replacing your INI replaces its preferences. To keep other personal settings,
; merge only Enabled=true and the eight active bindings into existing sections.
; Do not duplicate active action names. Do not install this preset through Vortex.
; Only the eight shoulder/trigger bindings below are overridden. The full layout
; and key reference are included; other commented bindings inherit mod defaults.
; Remove/comment these eight overrides to restore the main mod's swap.
; Restart the game after edits. Mod updates do not overwrite the personal INI.
;
; KEY REFERENCE - EVERY SUPPORTED VALUE
; Use the INI name or its full Gamepad_* name, ignoring letter case.
; PlayStation names below describe equivalent controls; they are NOT INI aliases.
;
; INI name        | Xbox / physical input        | PlayStation equivalent
; A               | Bottom face button (A)       | Cross
; B               | Right face button (B)        | Circle
; X               | Left face button (X)         | Square
; Y               | Top face button (Y)          | Triangle
; LB              | Left bumper / shoulder       | L1
; LT              | Left trigger                 | L2
; RB              | Right bumper / shoulder      | R1
; RT              | Right trigger                | R2
; LS              | PRESS the left stick         | L3
; RS              | PRESS the right stick        | R3
; View            | Back / View button           | Touchpad click
; Menu            | Start / Menu button          | Options
; DPadUp          | D-pad up                     | D-pad up
; DPadDown        | D-pad down                   | D-pad down
; DPadLeft        | D-pad left                   | D-pad left
; DPadRight       | D-pad right                  | D-pad right
; LeftStick       | TILT left stick, both axes   | Tilt left stick
; RightStick      | TILT right stick, both axes  | Tilt right stick
; RightStickLeft  | Tilt right stick LEFT        | Tilt right stick left
; RightStickRight | Tilt right stick RIGHT       | Tilt right stick right
;
; FULL UNREAL KEY NAMES (alternative spellings of the same controls)
; A               = Gamepad_FaceButton_Bottom
; B               = Gamepad_FaceButton_Right
; X               = Gamepad_FaceButton_Left
; Y               = Gamepad_FaceButton_Top
; LB              = Gamepad_LeftShoulder
; LT              = Gamepad_LeftTriggerAxis
; RB              = Gamepad_RightShoulder
; RT              = Gamepad_RightTriggerAxis
; LS              = Gamepad_LeftThumbstick
; RS              = Gamepad_RightThumbstick
; View            = Gamepad_Special_Left
; Menu            = Gamepad_Special_Right
; DPadUp          = Gamepad_DPad_Up
; DPadDown        = Gamepad_DPad_Down
; DPadLeft        = Gamepad_DPad_Left
; DPadRight       = Gamepad_DPad_Right
; LeftStick       = Gamepad_Left2D
; RightStick      = Gamepad_Right2D
; RightStickLeft  = Gamepad_RightStick_Left
; RightStickRight = Gamepad_RightStick_Right
;
; RULES AND SHARED BUTTONS
; - LS/RS mean stick CLICKS; LeftStick/RightStick mean movement axes.
; - Only Camera_Look and Traversal_Movement_Axis accept LeftStick/RightStick.
;   Those two actions require a stick axis; all other actions use scalar inputs.
; - This file does not add keyboard keys, extra Gamepad_* names, multi-button
;   chords, unbound/None values, or changes to menu navigation outside the preset.
; - Shared buttons are intentional: the game selects actions by context.
;   Assigning simultaneous actions to one button can activate both.
; - For the existing paired controls, keep Player_Focus_Mode with Combat_Abilities,
;   and Combat_Attack with Player_Abilities_Gamepad, on matching controls.
; - Keep Player_Hub_Map and Player_Hub_Launch on the same control for their
;   shared short-press / long-press shortcut. The threshold is fixed at 0.30 s.
; - Photo Mode rise/fall have separate entries; changing combat buttons does
;   not automatically change those entries.
; - The walk-to-run threshold remains 0.90; this file only changes bindings.
; - Missing entries use this mod's defaults. Unknown names/values, duplicate
;   entries or incompatible axes reject the WHOLE file and keep the packaged
;   layout. Comments begin with ';' or '#'. Only the two sections below are valid.
; - Runtime remapping requires compatible UE4SS and the default controller preset.
;   The game's cached prompts/layout screen may still show its original labels.

[General]
; true: apply these INI bindings. false: disable only runtime INI remapping.
; The packaged shoulder/trigger swap, walking and hub tweaks remain active.
Enabled = true

; true: report mapping updates in ue4ss/UE4SS.log. false: quieter normal logging.
; Errors still appear with the [ControllerTweaks] prefix.
; DebugLogging = false

[Bindings]

; --- MOVEMENT AND CAMERA ---
; Look around with the right stick. Requires LeftStick or RightStick.
; Camera_Look = RightStick

; Move with the left stick. Requires LeftStick or RightStick.
; Traversal_Movement_Axis = LeftStick

; Sprint: press the left stick (L3); this is not the walking threshold.
; Traversal_Sprint = LS

; Jump: bottom face button (Cross).
; Traversal_Jump = A

; Crouch: right face button (Circle).
; Traversal_Crouch = B

; Planeshift traversal action: top face button (Triangle).
; Traversal_Planeshift = Y

; --- COMBAT ---
; Draw / toggle the weapon: top face button (Triangle).
; Combat_Draw_Weapon = Y

; Block: left shoulder (L1), original game binding.
Combat_Block = LB

; Dodge: right face button (Circle), when the combat context is active.
; Combat_Dodge = B

; Attack: right shoulder (R1). Paired with overworld abilities.
Combat_Attack = RB

; Combat abilities: left trigger (L2). Paired with Focus Mode.
Combat_Abilities = LT

; Switch weapon: left face button (Square), in its applicable combat context.
; Combat_Switch_Weapon = X

; Lock target: press the right stick (R3), rather than tilt it.
; Combat_Target_Lock = RS

; Previous target: tilt the right stick left.
; Combat_Target_Previous = RightStickLeft

; Next target: tilt the right stick right.
; Combat_Target_Next = RightStickRight

; --- INTERACTION AND ABILITIES ---
; Interact: left face button (Square).
; Player_Interact = X

; Drink blood: left face button (Square), in the relevant ability context.
; Player_Drink_Blood = X

; Focus Mode: left trigger (L2). Match Combat_Abilities.
Player_Focus_Mode = LT

; Overworld controller abilities: right shoulder (R1). Match Combat_Attack.
Player_Abilities_Gamepad = RB

; Shadowstep: right trigger (R2), original game binding.
Player_Shadowstep = RT

; --- MAP, GAME HUB AND CONTROLS LEGEND ---
; Open Map with a SHORT press of View / touchpad by default.
; Keep this on the same control as Player_Hub_Launch for the shared shortcut.
; Player_Hub_Map = View

; Open Game Hub with a LONG press (0.30 s) of View / touchpad by default.
; Changing the button does not change the long-press trigger.
; Player_Hub_Launch = View

; Toggle the controls legend: Menu / Options. This entry does not add a pause
; menu binding or a compass-reveal feature.
; Toggle_Controls_Legend = Menu

; --- QUICKSLOTS ---
; Activate the top quickslot: D-pad up.
; Player_Quickslot_Top = DPadUp

; Activate the left quickslot: D-pad left.
; Player_Quickslot_Left = DPadLeft

; Activate the right quickslot: D-pad right.
; Player_Quickslot_Right = DPadRight

; Activate the bottom quickslot: D-pad down.
; Player_Quickslot_Bottom = DPadDown

; Toggle quickslots: bottom face button (Cross), in the quickslot context.
; Shares A with Jump by default; the game controls which context is active.
; Toggle_Quickslot = A

; --- PHOTO MODE ---
; Raise the Photo Mode camera: right trigger (R2), original game binding.
Photo_Vertical_Rise = RT

; Lower the Photo Mode camera: left trigger (L2), original game binding.
Photo_Vertical_Fall = LT

; Exit Photo Mode: right face button (Circle).
; Photo_Exit = B
